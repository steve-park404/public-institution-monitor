name: V8.14.21 진단 후보 기록

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl

      - name: Check input
        shell: bash
        run: |
          test -f monitor.py
          if [ ! -f "기관별_상태.csv" ]; then
            echo "기관별_상태.csv가 없습니다."
            exit 1
          fi
          python - <<'PY'
          import csv
          p="기관별_상태.csv"
          with open(p,encoding="utf-8-sig",newline="") as f:
              rows=list(csv.DictReader(f))
          if len(rows)<300:
              raise SystemExit(f"기관별_상태.csv 행 수 부족: {len(rows)}")
          board=sum(1 for r in rows if (r.get("게시판URL") or "").strip().startswith(("http://","https://")))
          print(f"manual board URL rows: {board}")
          if board<300:
              raise SystemExit(f"게시판 URL 부족: {board}")
          PY

      - name: Run V8.14.21
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V8.14.21-results
          path: |
            기관별_상태.csv
            진단_후보.csv
            daily_summary.json
            diagnostics.json
            state.json
            pending.json
            retry_queue.json
            checked_posts.json
            board_cache.json
          if-no-files-found: warn

      - name: Commit state
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 기관별_상태.csv 진단_후보.csv daily_summary.json diagnostics.json state.json pending.json retry_queue.json checked_posts.json board_cache.json
          git diff --cached --quiet || git commit -m "chore: V8.14.21 monitoring state and diagnostics"
          git push
