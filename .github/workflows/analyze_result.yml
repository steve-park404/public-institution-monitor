name: Analyze Missing Result

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Check files
        run: |
          echo "현재 저장소 파일:"
          ls -lh

          echo ""
          echo "분석 파일 확인:"
          ls -lh missing_structure_analysis.xlsx

      - name: Analyze result
        run: |
          python analyze_result.py
