name: V6.4 Precision Board Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp beautifulsoup4 pandas openpyxl

      - name: Check input file
        run: |
          if [ ! -f "boards_v6_3_analysis.xlsx" ]; then
            echo "ERROR: boards_v6_3_analysis.xlsx not found"
            exit 1
          fi

          echo "Input file OK"
          ls -lh boards_v6_3_analysis.xlsx

      - name: Run V6.4 validation
        run: |
          python validate_v6_4.py

      - name: Check output file
        run: |
          if [ ! -f "boards_v6_4_validation.xlsx" ]; then
            echo "ERROR: boards_v6_4_validation.xlsx not created"
            exit 1
          fi

          echo "Output file OK"
          ls -lh boards_v6_4_validation.xlsx

      - name: Upload validation result
        uses: actions/upload-artifact@v4
        with:
          name: boards-v6-4-validation
          path: boards_v6_4_validation.xlsx

      - name: Commit validation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add boards_v6_4_validation.xlsx

          git diff --cached --quiet || \
            git commit -m "Add V6.4 board validation result"

          git push
