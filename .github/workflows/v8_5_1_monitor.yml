name: V8.5.1 공지사항 자동검색
on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 공지사항 검색
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_CONCURRENCY: "12"
          TIMEOUT_SECONDS: "15"
          RECENT_POSTS: "15"
          MAX_TOTAL_SECONDS: "600"
          HTTP_RETRIES: "2"
        run: python monitor.py
      - name: 상태 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json monitor_log.json
          git diff --cached --quiet || git commit -m "chore: V8.5.1 state update"
          git push
