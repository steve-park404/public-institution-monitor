name: V6.3 Precision Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  discover:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      - name: Install packages

        run: |

          python -m pip install --upgrade pip

          pip install \
            aiohttp \
            beautifulsoup4 \
            pandas \
            openpyxl


      - name: Check input

        run: |

          echo "===== boards_v6.xlsx ====="

          ls -lh boards_v6.xlsx

          echo ""

          echo "===== analyze_missing_v6_3.py ====="

          ls -lh analyze_missing_v6_3.py


      - name: Run V6.3

        run: |

          echo "=========================================="

          echo "V6.3 미발견 기관 정밀탐색 시작"

          echo "=========================================="

          python analyze_missing_v6_3.py


      - name: Check result

        run: |

          echo "=========================================="

          echo "V6.3 결과"

          echo "=========================================="

          ls -lh boards_v6_3_analysis.xlsx


      - name: Upload result

        uses: actions/upload-artifact@v4

        with:

          name: boards-v6-3-analysis

          path: boards_v6_3_analysis.xlsx

          if-no-files-found: error


      - name: Commit result

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add boards_v6_3_analysis.xlsx

          git diff --cached --quiet \
            || git commit \
            -m "Add V6.3 precision discovery result"

          git push
