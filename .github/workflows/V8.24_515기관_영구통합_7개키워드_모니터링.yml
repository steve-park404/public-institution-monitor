name: V8.24 515기관 영구통합 7개키워드 모니터링
on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"
permissions:
  contents: write
concurrency:
  group: public-institution-monitor-main
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl
      - name: Build permanent integrated target list
        run: python merge_permanent_targets.py
      - name: Verify integrated target count
        run: |
          python - <<'PY'
          import openpyxl
          wb=openpyxl.load_workbook("monitor_targets_통합.xlsx",read_only=True,data_only=True)
          ws=wb["355기관"] if "355기관" in wb.sheetnames else wb[wb.sheetnames[0]]
          count=sum(1 for _ in ws.iter_rows(min_row=2,values_only=True))
          print(f"영구 통합 대상: {count}개")
          if count < 500: raise SystemExit("통합 대상이 500개 미만입니다.")
          PY
      - name: Apply V8.24 patch
        run: |
          python V8.24_patch.py
          python -m py_compile monitor.py
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V8.24-results
          path: |
            기관별_상태.csv
            진단_후보.csv
            daily_summary.json
            diagnostics.json
            state.json
            pending.json
            retry_queue.json
            checked_posts.json
            board_cache.json
            monitor_targets_통합.xlsx
          if-no-files-found: warn
      - name: Commit permanent target list and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor.py V8.24_patch.py merge_permanent_targets.py "유사기관_추가모니터링_후보목록_URL입력완료 (2).xlsx" monitor_targets_통합.xlsx 기관별_상태.csv 진단_후보.csv daily_summary.json diagnostics.json state.json pending.json retry_queue.json checked_posts.json board_cache.json || true
          if git diff --cached --quiet; then echo "No generated changes to commit"; exit 0; fi
          git commit -m "V8.24: permanent integrated monitoring with 7 keywords"
          git push origin HEAD:main
