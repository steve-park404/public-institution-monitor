name: V8.12.9 355기관 최근30일 게시판 + Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: '10 0 * * *'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install requests beautifulsoup4 openpyxl
      - name: 355기관 모니터링
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: 상태 저장 및 안전한 Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json pending.json diagnostics.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update monitor state"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
      - name: Post Python 설정
        run: true
