name: V7.3 Grade 2 Automation Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check input
        run: |
          if [ ! -f "boards_v7_3_4grade.xlsx" ]; then
            echo "ERROR: boards_v7_3_4grade.xlsx not found."
            exit 1
          fi

      - name: Run V7.3
        run: |
          python validate_v7_3.py

      - name: Check result
        run: |
          if [ ! -f "boards_v7_3_grade2_validation.xlsx" ]; then
            echo "ERROR: result file not found."
            exit 1
          fi
          ls -lh boards_v7_3_grade2_validation.xlsx

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: v7-3-grade2-validation
          path: boards_v7_3_grade2_validation.xlsx
          if-no-files-found: error

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add boards_v7_3_grade2_validation.xlsx

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add V7.3 grade 2 automation validation result"
            git push origin HEAD:main
          fi
