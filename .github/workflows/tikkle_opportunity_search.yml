name: 티끌 알림봇 - 참여기회 웹검색 V2.1

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

concurrency:
  group: tikkle-opportunity-search
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml ddgs
      - name: Run opportunity search V2.1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tikkle_opportunity_search.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tikkle-opportunity-results-v2-1
          path: |
            티끌_기회_검색결과.csv
            티끌_기회_제외결과.csv
            티끌_기회_검색결과_요약.json
          retention-days: 30
      - name: Commit results and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tikkle_opportunity_search.py opportunity_state.json 티끌_기회_검색결과.csv 티끌_기회_제외결과.csv 티끌_기회_검색결과_요약.json
          git diff --cached --quiet || git commit -m "chore: improve opportunity filtering to V2.1"
          git push
