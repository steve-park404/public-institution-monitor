name: Analyze Missing Institutions V6.1

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run V6.1 analysis
        run: |
          python analyze_missing_v6.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: boards-v6-result
          path: boards_v6.xlsx
