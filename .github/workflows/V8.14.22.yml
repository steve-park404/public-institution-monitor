name: V8.14.22 6개 키워드 + 진단

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl
      - name: Check input
        shell: bash
        run: |
          test -f monitor.py
          test -f 기관별_상태.csv
          python - <<'PY'
          import csv
          with open("기관별_상태.csv",encoding="utf-8-sig",newline="") as f:
              rows=list(csv.DictReader(f))
          if len(rows)<300: raise SystemExit(f"기관별_상태.csv 행 수 부족: {len(rows)}")
          board=sum(1 for r in rows if (r.get("게시판URL") or "").strip().startswith(("http://","https://")))
          print(f"manual board URL rows: {board}")
          if board<300: raise SystemExit(f"게시판 URL 부족: {board}")
          PY
      - name: Run V8.14.22
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V8.14.22-results
          path: |
            기관별_상태.csv
            진단_후보.csv
            diagnostics.json
            daily_summary.json
            state.json
            pending.json
            retry_queue.json
            checked_posts.json
            board_cache.json
          if-no-files-found: ignore
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 기관별_상태.csv 진단_후보.csv diagnostics.json daily_summary.json state.json pending.json retry_queue.json checked_posts.json board_cache.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "V8.14.22 monitoring state"
          git push
