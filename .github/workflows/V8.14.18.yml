name: V8.14.18 355기관 수동게시판URL + 기존검색로직

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl

      - name: Check input
        run: |
          test -f 기관별_상태.csv
          python - <<'PY'
          import csv
          with open("기관별_상태.csv", encoding="utf-8-sig") as f:
              rows=list(csv.DictReader(f))
          urls=sum(1 for r in rows if (r.get("게시판URL") or "").strip())
          print(f"기관 수: {len(rows)}")
          print(f"게시판URL 입력: {urls}")
          if len(rows) < 300:
              raise SystemExit("기관 수가 300개 미만입니다.")
          if urls < 300:
              raise SystemExit("게시판URL 입력 수가 300개 미만입니다.")
          PY

      - name: Run V8.14.18
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: V8.14.18-results
          path: |
            기관별_상태.csv
            daily_summary.json
            state.json
            pending.json
            retry_queue.json
            checked_posts.json
            board_cache.json
          if-no-files-found: warn

      - name: Commit monitoring state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor.py 기관별_상태.csv daily_summary.json state.json pending.json retry_queue.json checked_posts.json board_cache.json || true
          git diff --cached --quiet || git commit -m "V8.14.18 수동 게시판 URL 반영"
          git push
