name: Analyze Missing Institutions V6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp beautifulsoup4 pandas openpyxl lxml

      - name: Check input files
        run: |
          echo "현재 저장소 파일:"
          ls -lh

          echo ""
          echo "입력 파일:"
          ls -lh boards_missing.xlsx

      - name: Run V6 analysis
        run: |
          python analyze_missing_v6.py

      - name: Check result
        run: |
          echo ""
          echo "V6 결과 파일:"
          ls -lh boards_v6.xlsx

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add boards_v6.xlsx

          git diff --cached --quiet || git commit -m "Add V6 missing institution board analysis"

          git push
