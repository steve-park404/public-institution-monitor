name: V8.12.4 355기관 최근30일 게시판 + Telegram

concurrency:
  group: public-institution-monitor
  cancel-in-progress: false

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml openpyxl

      - name: 355기관 모니터링
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: 상태 저장 및 안전한 Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json pending.json diagnostics.json

          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi

          git commit -m "chore: V8.12.4 monitor state update"

          for i in 1 2 3; do
            echo "Push attempt $i"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push 성공"
                exit 0
              fi
            else
              echo "Rebase 실패 - 상태 파일을 원격 기준으로 재정렬합니다."
              git rebase --abort || true
              git reset --soft origin/main
              git add state.json pending.json diagnostics.json
              git commit -m "chore: V8.12.4 monitor state update" || true
            fi

            sleep 3
          done

          echo "Push 최종 실패"
          exit 1
