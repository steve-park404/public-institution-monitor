name: Tikkle Daily Monitoring - 747 Targets / Title Only

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'

permissions:
  contents: write

concurrency:
  group: tikkle-daily-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl
      - name: Verify 747 target workbook
        run: |
          python - <<'PY'
          import openpyxl, os
          FILE='monitor_targets.xlsx'
          if not os.path.exists(FILE): raise SystemExit(f'{FILE} 없음')
          wb=openpyxl.load_workbook(FILE,read_only=True,data_only=True)
          ws=wb['355기관'] if '355기관' in wb.sheetnames else wb[wb.sheetnames[0]]
          headers=[c.value for c in ws[1]]
          required=['기관명','홈페이지URL','공지게시판URL','기관유형']
          missing=[x for x in required if x not in headers]
          if missing: raise SystemExit(f'필수 열 없음: {missing}')
          idx={v:i for i,v in enumerate(headers)}
          rows=list(ws.iter_rows(min_row=2,values_only=True))
          total=len(rows)
          board=sum(1 for r in rows if r[idx['공지게시판URL']] and str(r[idx['공지게시판URL']]).strip())
          print(f'통합 대상: {total}개')
          print(f'수동 입력 공지게시판 URL: {board}개')
          if total != 747: raise SystemExit(f'대상 기관 수가 747개가 아닙니다: {total}개')
          if board < 700: raise SystemExit(f'공지게시판 URL이 예상보다 적습니다: {board}개')
          print('747기관/수동 게시판 URL 검증 성공')
          PY
      - name: Preflight KOFPI board check
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          url='https://www.kofpi.or.kr/notice/notice_01.do'
          r=requests.get(url,timeout=20,headers={'User-Agent':'Mozilla/5.0 Tikkle/8.27.1'})
          r.raise_for_status()
          text=BeautifulSoup(r.text,'html.parser').get_text(' ',strip=True)
          target='2026 우리 임산물 숲푸드 콘텐츠 공모전 개최'
          print(f'한국임업진흥원 게시판 HTTP: {r.status_code}')
          print(f'한국임업진흥원 공모전 제목 발견: {target in text}')
          if target not in text:
              raise SystemExit('KOFPI 게시판에서 테스트 공모전 제목을 찾지 못했습니다.')
          PY
      - name: Apply Tikkle precision patch
        run: |
          python monitor_patch.py
          python -m py_compile monitor.py
      - name: Verify Tikkle configuration
        run: |
          python - <<'PY'
          import monitor
          expected=['설문','의견수렴','시민참여','국민참여','공모전','퀴즈 이벤트','평가단 모집','만족도 조사','이벤트','슬로건','표어']
          if monitor.KEYWORDS != expected: raise SystemExit(f'키워드 검증 실패: {monitor.KEYWORDS}')
          if monitor.TARGET_FILE_CANDIDATES != ['monitor_targets.xlsx']: raise SystemExit(f'대상파일 설정 오류: {monitor.TARGET_FILE_CANDIDATES}')
          assert monitor.is_result_or_announcement_title('2026 서울교통공사 유튜브 영상 공모전 수상 후보작 공개 검증 안내')
          assert monitor.is_result_or_announcement_title('비짓서울 API 활용 아이디어 공모전 최종 결과 발표')
          assert monitor.is_probably_site_title('한국농어촌공사 메인','한국농어촌공사 메인')
          assert monitor.is_probably_site_title('대학생활 : 한국기술교육대학교','대학생활 : 한국기술교육대학교')
          assert monitor.direct_title_opportunity_match('[공모] 2026 우리 임산물 숲푸드 콘텐츠 공모전 개최(~10.25)', '공모전')
          assert not monitor.direct_title_opportunity_match('2026 서울교통공사 유튜브 영상 공모전 수상 후보작 공개 검증 안내', '공모전')
          assert not monitor.direct_title_opportunity_match('비짓서울 API 활용 아이디어 공모전 최종 결과 발표', '공모전')
          assert not monitor.direct_title_opportunity_match('뉴스/소식 : 대한민국 산업수도 광양, 전남광주통합특별시 광양시 소개, 전자민원, 정보공개, 뉴스소식, 시민참여, 분야별정보', '시민참여')
          assert not monitor.direct_title_opportunity_match('이전글', '공모전')
          assert not monitor.direct_title_opportunity_match('주요누리집 닫기', '공모전')
          assert not monitor.meaningful_body_match('본문에 공모전이라는 단어가 있고 참여 신청 기간이 있습니다.', '공모전')
          print('티끌 설정/회귀 테스트 성공')
          PY
      - name: Run Tikkle daily monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Upload daily results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tikkle-results
          path: |
            기관별_상태.csv
            진단_후보.csv
            daily_summary.json
            diagnostics.json
            state.json
            pending.json
            retry_queue.json
            checked_posts.json
            board_cache.json
            monitor_targets.xlsx
          if-no-files-found: warn
      - name: Commit state and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor.py monitor_patch.py .github/workflows/tikkle_monitor.yml monitor_targets.xlsx 기관별_상태.csv 진단_후보.csv daily_summary.json diagnostics.json state.json pending.json retry_queue.json checked_posts.json board_cache.json || true
          if git diff --cached --quiet; then echo 'No generated changes to commit'; exit 0; fi
          git commit -m 'Tikkle: 747 targets and compact daily summary'
          git push origin HEAD:main
