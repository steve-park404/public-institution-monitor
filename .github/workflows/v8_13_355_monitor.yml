name: V8.14.1 355기관 최근30일 게시판 + Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"

permissions:
  contents: write

concurrency:
  group: public-institution-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl

      - name: 355기관 모니터링
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: 상태 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json pending.json diagnostics.json

          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi

          git commit -m "Update V8.14.1 monitoring state"

      - name: 최신 main 반영 후 Push
        run: |
          git fetch origin main

          if ! git rebase origin/main; then
            echo "Rebase conflict detected - keep current run state files."
            git checkout --theirs state.json pending.json diagnostics.json 2>/dev/null || true
            git add state.json pending.json diagnostics.json
            GIT_EDITOR=true git rebase --continue
          fi

          git push origin HEAD:main
