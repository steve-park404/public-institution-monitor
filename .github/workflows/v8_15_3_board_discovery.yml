name: "V8.15.3 게시판 자동 발견"

on:
  workflow_dispatch:
  schedule:
    - cron: "40 0 * * 0"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run board discovery
        run: python board_discovery_v8_15_3.py
      - name: Commit discovered boards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add board_cache.json 게시판_자동발견_결과.csv 게시판_자동발견_진단.json
          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "V8.15.3 게시판 자동 발견 결과 갱신"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v8.15.3-board-discovery
          path: |
            게시판_자동발견_결과.csv
            게시판_자동발견_진단.json
