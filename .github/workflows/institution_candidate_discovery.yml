name: 기관 후보 발굴 - 주간 V1.3

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: write

concurrency:
  group: institution-candidate-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests pandas beautifulsoup4 lxml openpyxl

      - name: Check input
        run: |
          test -f 기관별_상태.csv
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('기관별_상태.csv', encoding='utf-8-sig')
          assert '기관명' in df.columns, '기관명 열 없음'
          print('입력기관:', len(df))
          PY

      - name: Run candidate discovery V1.3
        run: |
          python candidate_discovery.py --input 기관별_상태.csv --output 기관후보_발굴결과.csv

      - name: Validate result quality
        run: |
          python - <<'PY'
          import pandas as pd, re
          p='기관후보_발굴결과.csv'
          df=pd.read_csv(p, encoding='utf-8-sig')
          assert '기관명' in df.columns
          bad=[]
          addr=re.compile(r'(서울특별시|부산광역시|대구광역시|인천광역시|광주광역시|대전광역시|울산광역시|세종특별자치시|제주특별자치도|경기도|강원특별자치도|충청북도|충청남도|전북특별자치도|전라남도|경상북도|경상남도)\\s+')
          types=['공기업(시장형)','공기업(준시장형)','준정부기관(기금관리형)','준정부기관(위탁집행형)','기타공공기관']
          for n in df['기관명'].fillna('').astype(str):
              if addr.search(n) or any(t in n for t in types): bad.append(n)
          assert not bad, f'기관명 정규화 오류: {bad[:10]}'
          print('V1.3 CSV 품질검증 통과:', len(df), '행')
          PY

      - name: Upload candidate discovery results
        uses: actions/upload-artifact@v4
        with:
          name: institution-candidate-discovery-v1-3
          path: |
            기관후보_발굴결과.csv
            기관후보_발굴결과_요약.json
            기관후보_발굴결과_진단.json
          retention-days: 30

      - name: Commit candidate files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 기관후보_발굴결과.csv 기관후보_발굴결과_요약.json 기관후보_발굴결과_진단.json candidate_discovery.py
          git diff --cached --quiet || git commit -m "chore: weekly institution candidate discovery V1.3"
          git fetch origin main
          git rebase origin/main || {
            git checkout --theirs 기관후보_발굴결과.csv 기관후보_발굴결과_요약.json 기관후보_발굴결과_진단.json candidate_discovery.py
            git add -A 기관후보_발굴결과.csv 기관후보_발굴결과_요약.json 기관후보_발굴결과_진단.json candidate_discovery.py
            git rebase --continue
          }
          git push origin HEAD:main
