name: V8.12.1 355기관 최근30일 공지게시판 + Telegram 대기열

concurrency:
  group: public-institution-monitor
  cancel-in-progress: false

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml openpyxl

      - name: 355기관 모니터링
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: 상태 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json pending.json

          git commit -m "chore: V8.12.1 355 institution state and telegram queue update" || true

          # 다른 실행이나 수동 변경으로 원격 main이 앞서 있는 경우 반영
          git pull --rebase origin main

          # 최신 원격 상태 위에 이번 실행 결과를 다시 push
          git push origin main
