name: V8.12.1 355기관 최근30일 공지게시판 + Telegram 대기열

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

# 같은 모니터링 workflow가 동시에 실행되는 것을 방지
concurrency:
  group: public-institution-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 355기관 모니터링
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_CONCURRENCY: "20"
          TIMEOUT_SECONDS: "15"
          RECENT_POSTS: "15"
          RECENT_DAYS: "30"
          MAX_TOTAL_SECONDS: "1200"
          HTTP_RETRIES: "2"
          TELEGRAM_MAX_SEND: "20"
          MAX_PENDING: "10000"
        run: |
          python monitor.py

      # monitor.py 실행으로 변경되는 파일을 빠짐없이 커밋
      - name: 상태 저장 및 안전한 Push
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=== 변경사항 확인 ==="
          git status --short

          # monitor.py가 만든 모든 변경사항을 stage
          git add -A

          if git diff --cached --quiet; then
            echo "커밋할 변경사항이 없습니다."
            exit 0
          fi

          git commit -m "chore: V8.12.1 355 institution state and telegram queue update"

          # 최신 원격 main을 받아 rebase 후 push
          for attempt in 1 2 3; do
            echo "=== Push 시도 ${attempt}/3 ==="

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "=== Push 성공 ==="
                exit 0
              fi
            else
              echo "=== Rebase 충돌 발생 ==="

              # 이번 모니터링 실행 결과의 상태/대기열을 유지
              git checkout --theirs -- state.json pending.json 2>/dev/null || true
              git add state.json pending.json 2>/dev/null || true

              # 로그/진단 파일 충돌도 현재 실행 결과를 유지
              for f in monitor_log.json board_discovery_log.json monitor_targets.xlsx; do
                if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                  git checkout --theirs -- "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                fi
              done

              GIT_EDITOR=true git -c core.editor=true rebase --continue
            fi

            sleep 5
          done

          echo "=== 3회 Push 실패 ==="
          exit 1
