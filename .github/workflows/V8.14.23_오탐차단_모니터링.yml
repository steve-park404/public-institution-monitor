name: V8.14.23 오탐차단 모니터링

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

concurrency:
  group: public-institution-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl

      - name: Apply V8.14.23 safe patch
        run: |
          python V8.14.23_patch.py
          python -m py_compile monitor.py

      - name: Check target file
        run: |
          python - <<'PY'
          import os, openpyxl

          candidates = ["monitor_targets.xlsx", "url.xlsx", "targets.xlsx"]
          path = next((p for p in candidates if os.path.exists(p)), None)

          if not path:
              raise SystemExit("기관 목록 Excel을 찾지 못했습니다.")

          wb = openpyxl.load_workbook(path, read_only=True, data_only=True)
          ws = wb["355기관"] if "355기관" in wb.sheetnames else wb[wb.sheetnames[0]]
          count = sum(1 for _ in ws.iter_rows(min_row=2, values_only=True))

          print(f"기관 목록: {path}")
          print(f"모니터링 대상: {count}개")

          if count < 350:
              raise SystemExit("기관 수가 예상보다 적습니다.")
          PY

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V8.14.23-results
          path: |
            기관별_상태.csv
            daily_summary.json
            diagnostics.json
            state.json
            pending.json
            retry_queue.json
            checked_posts.json
            board_cache.json
          if-no-files-found: warn

      - name: Commit generated state and patched monitor
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             monitor.py             기관별_상태.csv             daily_summary.json             diagnostics.json             state.json             pending.json             retry_queue.json             checked_posts.json             board_cache.json             V8.14.23_patch.py             || true

          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi

          git commit -m "V8.14.23: tighten false-positive filtering"
          git push origin HEAD:main
