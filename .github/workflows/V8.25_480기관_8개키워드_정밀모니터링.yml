name: V8.25 480기관 8개키워드 정밀 모니터링

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

concurrency:
  group: public-institution-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl

      - name: Build permanent integrated target list
        run: |
          python merge_permanent_targets.py

      - name: Verify integrated target count
        run: |
          python - <<'PY'
          import openpyxl
          FILE = "monitor_targets_통합.xlsx"
          MINIMUM_TARGET_COUNT = 355
          wb = openpyxl.load_workbook(FILE, read_only=True, data_only=True)
          ws = wb["355기관"] if "355기관" in wb.sheetnames else wb[wb.sheetnames[0]]
          count = sum(1 for _ in ws.iter_rows(min_row=2, values_only=True))
          print(f"영구 통합 대상: {count}개")
          if count < MINIMUM_TARGET_COUNT:
              raise SystemExit(f"영구 통합 대상이 {MINIMUM_TARGET_COUNT}개 미만입니다: {count}개")
          print("영구 통합 대상 검증 성공")
          PY

      - name: Apply V8.25 patch
        run: |
          python V8.25_patch.py
          python -m py_compile monitor.py

      - name: Verify keywords
        run: |
          python - <<'PY'
          import monitor
          expected = [
              "설문", "의견수렴", "시민참여", "국민참여",
              "공모전", "퀴즈 이벤트", "평가단 모집", "만족도 조사"
          ]
          if monitor.KEYWORDS != expected:
              raise SystemExit(f"키워드 검증 실패: {monitor.KEYWORDS}")
          print("키워드 8개 검증 성공")
          print(f"HTTP_RETRIES={monitor.HTTP_RETRIES}")
          PY

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V8.25-results
          path: |
            기관별_상태.csv
            진단_후보.csv
            daily_summary.json
            diagnostics.json
            state.json
            pending.json
            retry_queue.json
            checked_posts.json
            board_cache.json
            monitor_targets_통합.xlsx
          if-no-files-found: warn

      - name: Commit permanent target list and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            monitor.py \
            V8.25_patch.py \
            merge_permanent_targets.py \
            monitor_targets_통합.xlsx \
            기관별_상태.csv \
            진단_후보.csv \
            daily_summary.json \
            diagnostics.json \
            state.json \
            pending.json \
            retry_queue.json \
            checked_posts.json \
            board_cache.json \
            || true

          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi

          git commit -m "V8.25: improve false-positive filtering and detail retries"
          git push origin HEAD:main
