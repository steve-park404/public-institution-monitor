name: "V8.15.4 미확인 기관 게시판 자동 발견"
on:
  workflow_dispatch:
  schedule:
    - cron: "40 0 * * 0"
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python board_discovery_v8_15_4.py
      - name: Commit discovered boards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add board_cache.json 게시판_자동발견_V8.15.4_결과.csv 게시판_자동발견_V8.15.4_진단.json
          if git diff --cached --quiet; then echo "변경사항 없음"; else git commit -m "V8.15.4 미확인 기관 게시판 자동 발견"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin "HEAD:${GITHUB_REF_NAME}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: v8.15.4-board-discovery
          path: |
            게시판_자동발견_V8.15.4_결과.csv
            게시판_자동발견_V8.15.4_진단.json
