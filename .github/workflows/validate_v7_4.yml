name: V7.4 Final Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4

      - name: Check input
        run: |
          test -f boards_v7_3_grade2_validation.xlsx
          test -f validate_v7_4.py

      - name: Run V7.4
        run: python validate_v7_4.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: boards-v7-4-final-validation
          path: boards_v7_4_final_validation.xlsx
          if-no-files-found: error
