name: V6.8 Deep Board Re-validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V6.8
        run: |
          python validate_v6_8.py

      - name: Check V6.8 result
        run: |
          if [ ! -f "boards_v6_8_validation.xlsx" ]; then
            echo "ERROR: boards_v6_8_validation.xlsx not found."
            exit 1
          fi

          echo "V6.8 result file:"
          ls -lh boards_v6_8_validation.xlsx

      - name: Upload V6.8 result
        uses: actions/upload-artifact@v4
        with:
          name: v6-8-validation-result
          path: boards_v6_8_validation.xlsx
          if-no-files-found: error

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add boards_v6_8_validation.xlsx

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add V6.8 validation result"
            git push origin HEAD:main
          fi
