name: V8.23.1 기존기관 + 유사기관 통합 모니터링

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

concurrency:
  group: public-institution-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl

      - name: Merge manually verified similar-institution URLs
        run: python merge_extra_targets.py

      - name: Check merged target count
        run: |
          python - <<'PY'
          import os, openpyxl

          candidates = ["monitor_targets.xlsx", "url.xlsx", "targets.xlsx"]
          path = next((p for p in candidates if os.path.exists(p)), None)
          if not path:
              raise SystemExit("기존 기관목록 Excel을 찾지 못했습니다.")

          wb = openpyxl.load_workbook(path, read_only=True, data_only=True)
          ws = wb["355기관"] if "355기관" in wb.sheetnames else wb[wb.sheetnames[0]]
          count = sum(1 for _ in ws.iter_rows(min_row=2, values_only=True))
          print(f"통합 모니터링 대상: {count}개")

          if count < 350:
              raise SystemExit("통합 기관 수가 예상보다 적습니다.")
          PY

      - name: Run existing monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V8.23.1-results
          path: |
            기관별_상태.csv
            daily_summary.json
            diagnostics.json
            state.json
            pending.json
            retry_queue.json
            checked_posts.json
            board_cache.json
          if-no-files-found: warn

      - name: Commit generated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            기관별_상태.csv \
            daily_summary.json \
            diagnostics.json \
            state.json \
            pending.json \
            retry_queue.json \
            checked_posts.json \
            board_cache.json \
            merge_extra_targets.py \
            "유사기관_추가모니터링_후보목록_URL입력완료 (2).xlsx" \
            || true

          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi

          git commit -m "V8.23.1: integrate similar institution board URLs"
          git push origin HEAD:main
