name: V8.3 공지사항 후보 자동검증

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 패키지 설치
        run: pip install pandas openpyxl aiohttp beautifulsoup4

      - name: 후보 검증
        env:
          MAX_CONCURRENCY: "15"
          TIMEOUT_SECONDS: "15"
          POST_CHECK: "8"
        run: python validate_v8_3.py

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v8_3_notice_validation.xlsx
          git diff --cached --quiet || git commit -m "chore: V8.3 notice candidate validation"
          git push
