name: V7.1 Real Board Structure Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check input
        run: |
          if [ ! -f "boards_cleaned.xlsx" ]; then
            echo "ERROR: boards_cleaned.xlsx not found."
            exit 1
          fi
          echo "Input:"
          ls -lh boards_cleaned.xlsx

      - name: Run V7.1
        run: |
          python validate_v7_1.py

      - name: Check result
        run: |
          if [ ! -f "boards_v7_1_validation.xlsx" ]; then
            echo "ERROR: boards_v7_1_validation.xlsx not found."
            exit 1
          fi
          echo "Result:"
          ls -lh boards_v7_1_validation.xlsx

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: v7-1-real-board-validation
          path: boards_v7_1_validation.xlsx
          if-no-files-found: error

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add boards_v7_1_validation.xlsx

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add V7.1 real board validation result"
            git push origin HEAD:main
          fi
