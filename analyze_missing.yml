name: Analyze Missing Institutions

on:
  workflow_dispatch:

jobs:
  analyze-missing:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 설치
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 필요한 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 미발견 기관 분석
      - name: Run analyze_missing.py
        run: |
          python analyze_missing.py

      # 5. 분석 결과 저장
      - name: Save analysis result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add missing_structure_analysis.xlsx

          git diff --cached --quiet || git commit -m "Analyze missing institutions"

          git push
